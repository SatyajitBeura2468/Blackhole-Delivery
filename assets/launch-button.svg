<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 112" width="520" height="112" role="img" aria-label="Play Blackhole Delivery in your browser">
<defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#ff9f2e"/></linearGradient>
<radialGradient id="g"><stop offset="0" stop-color="#ff4fa3" stop-opacity=".8"/><stop offset="1" stop-color="#ff4fa3" stop-opacity="0"/></radialGradient>
<linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset=".5" stop-color="#ff4fa3"/><stop offset="1" stop-color="#ffb347"/></linearGradient></defs>
<style>.halo{transform-box:fill-box;transform-origin:center;animation:h 2.4s ease-in-out infinite}@keyframes h{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.9;transform:scale(1.03)}}
.sp{transform-box:fill-box;transform-origin:center;animation:s 5s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
.ar{animation:ar 1.6s ease-in-out infinite}@keyframes ar{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.halo,.sp,.ar{animation:none}}</style>
<rect class="halo" x="6" y="8" width="508" height="100" rx="50" fill="#ff9f2e" opacity=".45" style="filter:blur(10px)"/>
<rect x="10" y="16" width="500" height="88" rx="44" fill="#b8620f"/>
<rect x="10" y="10" width="500" height="88" rx="44" fill="url(#a)"/>
<g transform="translate(66 54)"><circle r="34" fill="url(#g)" class="halo"/><circle r="27" fill="none" stroke="url(#ring)" stroke-width="6" stroke-dasharray="40 14" class="sp"/><circle r="20" fill="#02000a"/></g>
<text x="118" y="50" font-family="'Baloo 2',ui-rounded,system-ui,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#3a1d00" letter-spacing="1">PLAY NOW</text>
<text x="119" y="76" font-family="'Baloo 2',ui-rounded,system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#7a3f06" letter-spacing="1.2">BLACKHOLE-DELIVERY.VERCEL.APP</text>
<g class="ar"><path d="M452 54h28M468 41l13 13-13 13" fill="none" stroke="#3a1d00" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
